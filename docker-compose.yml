version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: velog
      POSTGRES_USER: velog
      POSTGRES_PASSWORD: velog
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./BackEnd/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=velog
      - PGUSER=velog
      - PGPASSWORD=velog
    env_file:
      - ./BackEnd/.env
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - db
    restart: unless-stopped

volumes:
  pg_data: